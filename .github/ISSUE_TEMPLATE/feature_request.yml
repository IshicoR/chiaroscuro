name: Feature request
description: Suggest an improvement for Chiaroscuro.
title: "[Feature]: "
labels: [enhancement, "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Chiaroscuro supports iRacing only; proposals for other simulators are out of scope.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need or limitation that motivates this request.
      placeholder: It is difficult to ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or user experience you would like.
      placeholder: Add a dashboard widget that ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative approaches you have considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, screenshots, telemetry context, or other details that could help evaluate the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This proposal is within Chiaroscuro's iRacing-only scope.
          required: true
