[workspace]
resolver = "3"
members = [
    "chiaro_rs/actions",
    "chiaro_rs/car_setup_ui",
    "chiaro_rs/chiaro",
    "chiaro_rs/config",
    "chiaro_rs/telemetry_ui",
    "chiaro_rs/ibt_picker",
    "chiaro_rs/i18n",
    "chiaro_rs/irsdk",
    "chiaro_rs/live_telemetry",
    "chiaro_rs/navigation_ui",
    "chiaro_rs/settings_ui",
    "chiaro_rs/telemetry",
    "chiaro_rs/time_series_chart",
    "chiaro_rs/tray",
    "chiaro_rs/regulations_ui",
    "chiaro_rs/widgets",
    "chiaro_rs/window",
]

[workspace.package]
version = "0.3.0"
authors = ["Ryuji Ishimi"]
edition = "2024"
rust-version = "1.96"
publish = true
license = "GPL-3.0-or-later"

[workspace.dependencies]
bitflags = "2.13.0"
chiaro = { version = "0.3.0", path = "chiaro_rs/chiaro" }
chiaro_actions = { version = "0.3.0", path = "chiaro_rs/actions" }
chiaro_car_setup_ui = { version = "0.3.0", path = "chiaro_rs/car_setup_ui" }
chiaro_config = { version = "0.3.0", path = "chiaro_rs/config" }
chiaro_telemetry_ui = { version = "0.3.0", path = "chiaro_rs/telemetry_ui" }
chiaro_ibt_picker = { version = "0.3.0", path = "chiaro_rs/ibt_picker" }
chiaro_i18n = { version = "0.3.0", path = "chiaro_rs/i18n" }
chiaro_live_telemetry = { version = "0.3.0", path = "chiaro_rs/live_telemetry" }
chiaro_navigation_ui = { version = "0.3.0", path = "chiaro_rs/navigation_ui" }
chiaro_settings_ui = { version = "0.3.0", path = "chiaro_rs/settings_ui" }
chiaro_time_series_chart = { version = "0.3.0", path = "chiaro_rs/time_series_chart" }
chiaro_tray = { version = "0.3.0", path = "chiaro_rs/tray" }
chiaro_regulations_ui = { version = "0.3.0", path = "chiaro_rs/regulations_ui" }
chiaro_window = { version = "0.3.0", path = "chiaro_rs/window" }
chiaro_widgets = { version = "0.3.0", path = "chiaro_rs/widgets" }
chiaro_irsdk = { version = "0.3.0", path = "chiaro_rs/irsdk" }
chiaro_telemetry = { version = "0.3.0", path = "chiaro_rs/telemetry" }
config = "0.15.25"
encoding_rs = "0.8.35"
iced = { version = "0.14.0", features = ["smol"] }
iced_fonts = { version = "0.3.0", default-features = false, features = ["lucide"] }
iced_plot = "0.5.0"
image = { version = "0.25.8", default-features = false, features = ["png"] }
rpmalloc = "0.2.2"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = "0.10.0"
smol = "2.0.2"
toml = "1.1.2"
tray-icon = "0.24.1"
winapi = { version = "0.3.9", features = [
    "handleapi",
    "memoryapi",
    "processthreadsapi",
    "synchapi",
    "winbase",
    "winerror",
    "winnt",
] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
dead_code = "warn"

[workspace.lints.clippy]
type-complexity = "allow"
map-entry = "allow"
large-enum-variant = "allow"
result_large_err = "allow"
semicolon_if_nothing_returned = "deny"
trivially-copy-pass-by-ref = "deny"
match-wildcard-for-single-variants = "deny"
redundant-closure-for-method-calls = "deny"
filter_map_next = "deny"
manual_let_else = "deny"
unused_async = "deny"
from_over_into = "deny"
needless_borrow = "deny"
useless_conversion = "deny"

[profile.release]
opt-level = 3
debug = false
strip = "debuginfo"
overflow-checks = false
lto = "fat"
panic = "unwind"
codegen-units = 1
incremental = false

[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"
strip = false
overflow-checks = true
lto = "off"
panic = "unwind"
codegen-units = 256
incremental = true
