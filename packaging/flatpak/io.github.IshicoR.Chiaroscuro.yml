app-id: io.github.IshicoR.Chiaroscuro
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
command: chiaro
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: chiaroscuro
    buildsystem: simple
    build-commands:
      - cargo build --offline --release -p chiaro --config 'source.crates-io.replace-with="vendored-sources"' --config 'source.vendored-sources.directory="packaging/flatpak/vendor"'
      - install -Dm755 target/release/chiaro /app/bin/chiaro
      - install -Dm644 packaging/flatpak/io.github.IshicoR.Chiaroscuro.desktop /app/share/applications/io.github.IshicoR.Chiaroscuro.desktop
      - install -Dm644 packaging/flatpak/io.github.IshicoR.Chiaroscuro.metainfo.xml /app/share/metainfo/io.github.IshicoR.Chiaroscuro.metainfo.xml
      - install -Dm644 packaging/flatpak/io.github.IshicoR.Chiaroscuro.png /app/share/icons/hicolor/512x512/apps/io.github.IshicoR.Chiaroscuro.png
    sources:
      - type: dir
        path: ../..
